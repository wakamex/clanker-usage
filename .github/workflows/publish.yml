name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: wakamex/release-actions/.github/workflows/python-validation.yml@stable

  # One tag publishes clanker-usage and the wrapper packages generated from it by build_wrappers.py.
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Generate the wrapper packages
        run: uv --no-config run --locked python build_wrappers.py dist-wrappers
      # The wrappers pin this exact version of clanker-usage, so it goes first.
      - uses: wakamex/release-actions/pypi-publish@stable
      - uses: wakamex/release-actions/pypi-publish@stable
        with:
          working-directory: dist-wrappers/agy-usage
      - uses: wakamex/release-actions/pypi-publish@stable
        with:
          working-directory: dist-wrappers/ccusage
      - uses: wakamex/release-actions/pypi-publish@stable
        with:
          working-directory: dist-wrappers/codex-cli-usage
      - uses: wakamex/release-actions/pypi-publish@stable
        with:
          working-directory: dist-wrappers/cursor-cli-usage
      - uses: wakamex/release-actions/pypi-publish@stable
        with:
          working-directory: dist-wrappers/deepseek-harness-usage
      - uses: wakamex/release-actions/pypi-publish@stable
        with:
          working-directory: dist-wrappers/devin-cli-usage
      - uses: wakamex/release-actions/pypi-publish@stable
        with:
          working-directory: dist-wrappers/gemini-cli-usage
      - uses: wakamex/release-actions/pypi-publish@stable
        with:
          working-directory: dist-wrappers/zcode-cli-usage
      # opencode-cli-usage is new on PyPI and goes last: its pending publisher can be registered
      # only after clanker-usage's first upload frees the repository's one pending slot.
      - uses: wakamex/release-actions/pypi-publish@stable
        with:
          working-directory: dist-wrappers/opencode-cli-usage

  github-release:
    needs: publish
    permissions:
      contents: write
    uses: wakamex/release-actions/.github/workflows/github-release.yml@stable
