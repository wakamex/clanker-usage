[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "clanker-usage"
version = "0.4.1"
description = "Plan and quota of coding-agent accounts, with a statusline, a cache daemon and a check for provider changes"
readme = "README.md"
keywords = ["usage", "quota", "statusline", "z.ai", "ai-agents", "cli"]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# DeepSeek Harness keeps its credentials in YAML.
deepseek = ["pyyaml>=6.0.3"]

[project.urls]
Homepage = "https://github.com/wakamex/clanker-usage"
Source = "https://github.com/wakamex/clanker-usage"

[project.scripts]
clanker-usage = "clanker_usage:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clanker_usage"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests/test_core.py", "/tests/test_zcode.py", "/tests/test_install.py", "/build_wrappers.py", "/README.md", "/LICENSE"]

[dependency-groups]
# The tests cover every provider, including DeepSeek's YAML credential store.
dev = ["pyyaml>=6.0.3"]
